<div class="d-flex align-items-center bg-white rounded" [ngClass]="colorClass">
    <mat-icon class="me-2" [ngClass]="colorClass">{{ icon }}</mat-icon>
    <span class="flex-grow-1">{{ data.message }}</span>
    <button mat-icon-button (click)="snackBarRef.dismiss()">
        <mat-icon>close</mat-icon>
    </button>
</div>
