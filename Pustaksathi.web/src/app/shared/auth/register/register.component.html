<div class="signup-container" data-theme="light">

    <div class="card">
        <span class="text-center">
            <h1>PustakSathi</h1>
        </span>
        <form [formGroup]="formGroup">
            <div class="form-control">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" formControlName="fullName" placeholder="Your Name" required />
                <span class="helper-text" id="name-error"></span>
            </div>
            <div class="form-control">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" formControlName="email" placeholder="your@email.com"
                    required />
                <span class="helper-text" id="email-error"></span>
            </div>
            <div class="form-control">
                <label for="password">Password</label>
                <small class="text-muted d-block mb-1">
                    • 6–100 characters<br />
                    • At least one numeric digit (0–9)<br />
                    • Letters and these symbols allowed: !&#64;#$%^&*
                </small>

                <div class="password-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" id="password" name="password"
                        formControlName="password" placeholder="Password Here" required />
                    <mat-icon class="password-toggle-icon" (click)="togglePasswordVisibility()">
                        {{ showPassword ? 'visibility_off' : 'visibility' }}
                    </mat-icon>
                </div>
            </div>

            <button type="submit" class="button button-contained" (click)="register()">
                Sign up
            </button>
        </form>
        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">or</span>
            <div class="divider-line"></div>
        </div>
        <p class="text-center">
            Already have an account? <a routerLink="/login" class="link">Sign in</a>
        </p>
    </div>
</div>
