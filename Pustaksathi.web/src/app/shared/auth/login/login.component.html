<div class="login-container" data-theme="light">
    <div class="card">
        <h1>PustakSathi</h1>
        <form [formGroup]="formGroup">
            <div class="form-control">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" formControlName="email" placeholder="your@email/gmail.com"
                    required autocomplete="email" />
                <span class="helper-text" id="email-error"></span>
            </div>
            <div class="form-control">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" id="password" name="password"
                        formControlName="password" placeholder="Password Here" required />
                    <mat-icon class="password-toggle-icon" (click)="togglePasswordVisibility()">
                        {{ showPassword ? 'visibility_off' : 'visibility' }}
                    </mat-icon>
                </div>
            </div>
            <button type="submit" class="button" (click)="login()">Log in</button>
        </form>
        <div class="signup-prompt">
            Don&rsquo;t have an account? <a routerLink="/register" class="link">Sign up</a>
        </div>
    </div>
</div>
